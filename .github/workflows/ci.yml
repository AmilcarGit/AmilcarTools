name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Comprobar sintaxis JavaScript
        run: node --check src/app.js
      - name: Comprobar sintaxis de herramientas avanzadas
        run: node --check src/advanced-tools.js
      - name: Comprobar sintaxis de herramientas extra
        run: node --check src/extra-tools.js
      - name: Comprobar sintaxis del menú
        run: node --check src/menu.js
      - name: Comprobar sintaxis del service worker
        run: node --check sw.js
      - name: Ejecutar pruebas de humo
        run: node --test tests/*.test.js
